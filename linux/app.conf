# TMP Calculadora — configuración de empaquetado Linux (la usa REGLA3/herramientas/linux-pkg/empaquetar.sh)
APP_ID=io.github.navarretenoir.TMPCalculadora
PAQUETE=tmp-calculadora
NOMBRE="TMP Calculadora"
NOMBRE_ARCHIVO=TMPCalculadora
VERSION=$(cat "$APP/VERSION")
BIN_GUI=tmp-calculadora
RESUMEN="Calculadora de dosificación de productos para acuarios de Tu Mundo Pet"
DESCRIPCION="Dices los litros de tu acuario, estanque o pileta y te dice cuánto producto usar, cuánto rinde cada envase y cuál conviene más, con la dosis de la ficha de 169 productos de Tu Mundo Pet. Sin internet."
DEPS_RPM="gtk4, webkitgtk6.0"
DEPS_DEB="libgtk-4-1, libwebkitgtk-6.0-4"
FLATPAK_EXTRA=""
SNAP_EXTRA=""
compilar() {
  local pre=$1 out=$2 w; w=$(mktemp -d)
  cp -a "$APP/desktop/." "$w/"; rm -f "$w/tmp-calculadora"
  make -s -C "$w" UI_DIR="$pre/share/tmp-calculadora/ui" >/dev/null; strip "$w/tmp-calculadora"; cp "$w/tmp-calculadora" "$out/"
  rm -rf "$w"
}
instalar() {
  install -Dm755 "$3/tmp-calculadora" "$1$2/bin/tmp-calculadora"
  mkdir -p "$1$2/share/tmp-calculadora/ui"; cp -r "$APP/app/." "$1$2/share/tmp-calculadora/ui/"; rm -rf "$1$2/share/tmp-calculadora/ui/"*.bak*
  sed -i '/Content-Security-Policy/d' "$1$2/share/tmp-calculadora/ui/index.html"   # desde file:// la CSP del navegador no aplica (sin red de todos modos)
}
appimage_entorno() { echo 'export TMPCALC_UI="$HERE/usr/share/tmp-calculadora/ui"'; }
