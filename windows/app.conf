# TMP Calculadora para Windows 10/11 (WebView2) — lo usa REGLA3/herramientas/winhost/construir.sh
NOMBRE="TMP Calculadora"
EXE=TmpCalculadora
VERSION=1.0
DESCRIPCION="Calculadora de dosificación de productos para acuarios de Tu Mundo Pet"
ARCHIVOS_EXTRA='  File /r "..\dist\ui"'
copiar_extra() { rm -rf "$1/ui"; mkdir -p "$1/ui"; cp -r "$W/../app/css" "$W/../app/js" "$W/../app/datos" "$W/../app/fuentes" "$W/../app/img" "$W/../app/index.html" "$1/ui/"; }
